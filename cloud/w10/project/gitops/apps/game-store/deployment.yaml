apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-store
  labels:
    app.kubernetes.io/name: game-store
    app.kubernetes.io/part-of: w10-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: game-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-store
        app.kubernetes.io/part-of: w10-project
    spec:
      containers:
        - name: game-store
          image: game-store:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
