# Rule 01: Cấm image tag :latest
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sDisallowedTags
metadata:
  name: no-latest-tag
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  enforcementAction: warn
  match:
    kinds:
    - apiGroups: ["apps"]           
      kinds: ["Deployment"]
    - apiGroups: ["argoproj.io"]    
      kinds: ["Rollout"]
  parameters:
    tags: ["latest"]