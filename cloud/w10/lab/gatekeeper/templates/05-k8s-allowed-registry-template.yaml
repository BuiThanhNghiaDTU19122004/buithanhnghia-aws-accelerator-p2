apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sallowedregistry
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    metadata.gatekeeper.sh/title: "Allowed Registry"
    metadata.gatekeeper.sh/version: 1.0.0
    description: >-
      Requires container images to come from an allowed registry.
spec:
  crd:
    spec:
      names:
        kind: K8sAllowedRegistry
        plural: k8sallowedregistries
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedRegistries:
              type: array
              description: List of allowed image registries.
              items:
                type: string
            exemptImages:
              type: array
              description: Images exempt from enforcement.
              items:
                type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sallowedregistry

        # Hàm kiểm tra image có nằm trong danh sách exempt không
        is_exempt(image) {
            exempt := input.parameters.exemptImages[_]
            contains(image, exempt)
        }

        # Hàm kiểm tra image có từ registry được phép không
        is_allowed_registry(image) {
            allowed := input.parameters.allowedRegistries[_]
            startswith(image, allowed)
        }

        # Kiểm tra containers
        violation[{"msg": msg}] {
            container := input_containers[_]
            image := container.image
            not is_exempt(image)
            not is_allowed_registry(image)
            msg := sprintf("Container image '%v' không đến từ registry được phép. Allowed registries: %v", [image, input.parameters.allowedRegistries])
        }

        # Lấy tất cả containers từ pod spec
        input_containers[c] {
            c := input.review.object.spec.containers[_]
        }
        input_containers[c] {
            c := input.review.object.spec.initContainers[_]
        }
        input_containers[c] {
            c := input.review.object.spec.ephemeralContainers[_]
        }