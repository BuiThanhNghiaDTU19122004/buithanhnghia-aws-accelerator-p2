# Build and push Docker image to GitHub Container Registry
name: Build and Push Image

on:
  push:
    branches:
      - main
    paths:
      - 'cloud/w10/lab/app-api/**'               
      - '.github/workflows/build-push.yml'
      - '!cloud/w10/lab/app-api/rollout.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/w10-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME_LOWERCASE=$(echo ${{ github.repository_owner }}/w10-api | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Calculate semantic version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE:|!:)"
          minor_pattern: "^feat"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.semver.outputs.version }}
            type=sha,prefix=v${{ steps.semver.outputs.version }}-

      # ===== BƯỚC 1: Build image CHỈ ở local, KHÔNG push =====
      - name: Build Docker image (local only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./cloud/w10/lab/src/api
          push: false
          load: true                       # Nạp image vào Docker daemon của Runner
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ===== BƯỚC 2: Scan image local trước khi push =====
      - name: Scan with Trivy (Security Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}:${{ steps.semver.outputs.version }}
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          # Nếu step này fail (exit-code 1), job dừng ngay tại đây.
          # => Image KHÔNG hề tồn tại trên ghcr.io. An toàn tuyệt đối.

      # ===== BƯỚC 3: Push CHỈ khi Trivy đã pass =====
      - name: Push Docker image
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker push "$tag"
          done

      # ===== Cosign Sign (chỉ ký image đã pass scan + đã push) =====
      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Sign image with Cosign
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}:${{ steps.semver.outputs.version }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Update rollout.yaml with new version
        run: |
          IMAGE_LOWERCASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWERCASE }}"
          sed -i "s|image: ghcr.io/.*/w10-api:.*|image: ${IMAGE_LOWERCASE}:${{ steps.semver.outputs.version }}|g" cloud/w10/lab/app-api/rollout.yaml
          sed -i "s|value: \"v.*\"|value: \"v${{ steps.semver.outputs.version }}\"|g" cloud/w10/lab/app-api/rollout.yaml

      - name: Commit and push version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud/w10/lab/app-api/rollout.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump version to v${{ steps.semver.outputs.version }}"
            git push
          fi

      - name: Create git tag
        run: |
          git tag v${{ steps.semver.outputs.version }}
          git push origin v${{ steps.semver.outputs.version }}